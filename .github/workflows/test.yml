name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # NOTE: package-lock.json on main is out of sync with package.json (supabase-js, dyad tagger),
      # so `npm ci` fails. Switch back to `npm ci` once the lockfile is regenerated.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      # Known pre-existing error in src/components/EnhancedAuthModal.tsx on main; reported, not hidden.
      - name: Typecheck renderer (known failing on main)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Typecheck Electron main process
        shell: bash
        run: |
          npx tsc -p tsconfig.electron.json --noEmit | tee tsc-electron.txt || true
          # Fail on any error except the known pre-existing ones in EnhancedAuthModal.tsx
          if grep "error TS" tsc-electron.txt | grep -v "src/components/EnhancedAuthModal.tsx"; then exit 1; fi
      - name: Unit tests
        if: always()
        run: npm run test:unit
