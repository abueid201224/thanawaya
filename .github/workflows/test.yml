name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # NOTE: package-lock.json on main is out of sync with package.json (supabase-js, dyad tagger),
      # so `npm ci` fails. Switch back to `npm ci` once the lockfile is regenerated.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm test
