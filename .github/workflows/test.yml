name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck renderer, Electron, and tests
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build renderer & Electron
        run: npm run build:all
      - name: Verify build security invariants
        run: npm run verify-build
      - name: E2E build contract tests
        run: npm run test:e2e
