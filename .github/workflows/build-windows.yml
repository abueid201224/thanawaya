name: Build & Release Windows Electron App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types:
      - published
      - created
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package Windows (x64)
    runs-on: windows-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔐 Validate Required Secrets for Windows Production Build
        shell: pwsh
        run: |
          $supabaseUrl = "${{ secrets.VITE_SUPABASE_URL }}"
          $supabaseKey = "${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          if ([string]::IsNullOrWhiteSpace($supabaseUrl) -or [string]::IsNullOrWhiteSpace($supabaseKey)) {
            Write-Error "::error::فشل التحقق: يجب تعيين أسرار GitHub (VITE_SUPABASE_URL و VITE_SUPABASE_ANON_KEY) لتثبيت مصادقة Supabase بالواجهة."
            exit 1
          }
          if (-not $supabaseUrl.StartsWith("https://")) {
            Write-Error "::error::فشل التحقق: عنوان VITE_SUPABASE_URL يجب أن يبدأ بـ https://"
            exit 1
          }
          Write-Host "✅ تم التحقق من وجود وصحة أسرار Supabase بنجاح."

      - name: 🔍 Type-check & Lint (TypeScript & Electron)
        run: npm run lint

      - name: 🧪 Run Automated Tests
        run: npm test

      - name: 🏗️ Build Frontend & Electron Processes
        run: npm run build:all
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🛡️ Verify Build Invariants & Anti-Drift Checks
        run: node scripts/verify-build.mjs

      - name: 📦 Package Windows Installer & Portable Executable
        run: npx electron-builder --win --x64 --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📤 Upload Build Artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ThanaweyaAmmaMathCopilot-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14

      - name: 🚀 Publish Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
