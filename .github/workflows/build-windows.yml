name: Build & Release Windows Electron App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types:
      - published
      - created
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package Windows (x64)
    runs-on: windows-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Type-check & Lint (TypeScript & Electron)
        run: npm run lint

      - name: 🧪 Run Automated Tests
        run: npm test

      - name: 🏗️ Build Frontend & Electron Processes
        run: npm run build:all

      - name: 📦 Package Windows Installer & Portable Executable
        run: npx electron-builder --win --x64 --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Build Artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Thanaweya-Math-Copilot-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14

      - name: 🚀 Publish Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
