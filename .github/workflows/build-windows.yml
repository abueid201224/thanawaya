name: Quality, Windows Build & Release

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests & Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Node dependencies from lockfile
        run: npm ci --include=optional --no-audit --no-fund

      - name: Run .NET application tests
        run: dotnet test ThanaweyaAmma/tests/ThanaweyaAmma.Tests/ThanaweyaAmma.Tests.csproj --configuration Release

      - name: Run TypeScript checks and unit tests
        run: npm test

      - name: Build frontend and Electron processes
        run: npm run build:all
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build and security invariants
        run: node scripts/verify-build.mjs

      - name: Upload compiled app for packaging
        uses: actions/upload-artifact@v4
        with:
          name: thanaweya-compiled-app
          path: |
            dist/
            dist-electron/
          if-no-files-found: error
          retention-days: 3

  package-windows:
    name: Package Windows x64
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install packaging dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Download verified application build
        uses: actions/download-artifact@v4
        with:
          name: thanaweya-compiled-app
          path: .

      - name: Create Windows installer and portable build
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish never

      - name: Verify packaged Windows archive
        run: node scripts/verify-build.mjs
        env:
          VERIFY_WINDOWS_PACKAGE: '1'

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThanaweyaAmmaMathCopilot-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Windows assets to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ThanaweyaAmmaMathCopilot-Windows-x64
          path: release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
