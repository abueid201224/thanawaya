appId: "com.thanaweya.mathcopilot"
productName: "Thanaweya Amma Math Copilot"
copyright: "Copyright © 2026-2027 Thanaweya Amma Educational Systems"

directories:
  output: "release"
  buildResources: "build"

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
  - "!**/*.map"
  - "!node_modules"
  - "!node_modules/**/*"

extraMetadata:
  main: "dist-electron/main.cjs"

electronLanguages:
  - "ar"
  - "en-US"

win:
  icon: "installer-assets/icon.ico"
  artifactName: "ThanaweyaAmmaMathCopilot-Setup-${version}.${ext}"
  legalTrademarks: "Thanaweya Amma Math Copilot"
  target:
    - nsis
    - portable
  sign: true
  signingHashAlgorithms:
    - "sha256"
  rfc3161TimeStampServer: "http://timestamp.digicert.com"
  certificateFile: "installer-assets/cert.pfx"
  certificatePassword: "${CERTIFICATE_PASSWORD}"

nsis:
  oneClick: false
  language: "1025"
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Thanaweya Amma Math Copilot"
  uninstallDisplayName: "Thanaweya Amma Math Copilot (إلغاء التثبيت)"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  perMachine: false

portable:
  artifactName: "ThanaweyaAmmaMathCopilot-Portable-${version}.${ext}"

compression: "maximum"
asar: true
